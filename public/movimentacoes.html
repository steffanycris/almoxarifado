<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movimentações | Almoxarifado</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header class="cabecalho">
    <div class="logo">🫧 Almoxarifado</div>

    <nav class="menu" aria-label="Navegação principal">
        <a href="painel.html">Painel</a>
        <a href="produtos.html">Produtos</a>
        <a href="movimentacoes.html" class="ativo" aria-current="page">
          Movimentações
        </a>
        <a href="index.html" id="link-sair">Sair</a>
      </nav>
    </header>
  
    <main>
      <h1>Movimentações</h1>
  
      <section class="cartao">
        <h2>Registrar entrada ou saída</h2>
        <form id="form-movimentacao">
          <label for="livro_id">Produto</label>
          <select id="livro_id" required>
            <option value="">Selecione um produto</option>
            <option value="1">Sabão em pó - Tixan</option>
            <option value="2">Pasta de dente - Colgate</option>
          </select>
  
          <label for="tipo">Tipo</label>
          <select id="tipo" required>
            <option value="entrada">Entrada</option>
            <option value="saida">Saída</option>
          </select>
  
          <label for="quantidade">Quantidade</label>
          <input type="number" id="quantidade" min="1" value="1" required>
  
          <button type="submit" class="botao">Registrar</button>
        </form>
        <p id="mensagem" class="mensagem" aria-live="polite"></p>
      </section>
  
      <section class="cartao">
        <h2>Histórico</h2>
        <div class="tabela-rolagem">
          <table>
            <thead>
              <tr>
                <th>Data</th>
                <th>Produto</th>
                <th>Tipo</th>
                <th>Quantidade</th>
              </tr>
            </thead>
            <tbody id="lista-movimentacoes">
              <tr>
                <td>01/10/2026</td>
                <td>Sabão em Pó</td>
                <td><span class="etiqueta entrada">Entrada</span></td>
                <td>10</td>
              </tr>
              <tr>
                <td>02/10/2026</td>
                <td>Sabão em Pó</td>
                <td><span class="etiqueta saida">Saída</span></td>
                <td>3</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  
    <footer class="rodape">Almoxarifado © 2026 | Feito por Steffany</footer>
  </body>
  </html>
