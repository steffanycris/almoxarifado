<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produtos | Almoxarifado</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header class="cabecalho">
    <div class="logo">🫧 Almoxarifado</div>

    <nav class="menu" aria-label="Navegação principal">
      <a href="painel.html">Painel</a>
      <a href="produtos.html" class="ativo" aria-current="page">Produtos</a>
      <a href="movimentacoes.html">Movimentações</a>
      <a href="index.html" id="link-sair">Sair</a>
    </nav>
  </header>

  <main>
    <h1>Produtos</h1>

    <section class="cartao">
      <h2>Cadastrar novo produto</h2>
      <form id="form-produto">
        <label for="titulo">Nome</label>
        <input type="text" id="titulo" placeholder="Ex.: Shampoo" required>

        <label for="autor">Categoria</label>
        <input type="text" id="autor" placeholder="Ex.: Pessoal" required>

        <label for="quantidade_estoque">Quantidade em estoque</label>
        <input type="number" id="quantidade_estoque" min="0" value="0">

        <button type="submit" class="botao">Cadastrar</button>
      </form>
      <p id="mensagem" class="mensagem" aria-live="polite"></p>
    </section>

    <section class="cartao">
      <h2>Produtos cadastrados</h2>
      <div class="linha-busca">
        <input
          type="text"
          id="busca-nome"
          placeholder="Buscar pelo nome..."
          aria-label="Buscar pelo nome"
        >
        <button
          type="button"
          id="botao-buscar"
          class="botao botao-secundario"
        >
          Buscar
        </button>
      </div>

      <div class="tabela-rolagem">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>Categoria</th>
              <th>Estoque</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="lista-produtos">
            <tr>
              <td>1</td>
              <td>Sabão em pó - Tixan</td>
              <td>Domiciliar</td>
              <td>12</td>
              <td>
                <button type="button" class="botao botao-perigo botao-pequeno">
                  Excluir
                </button>
              </td>
            </tr>
            <tr>
              <td>2</td>
              <td>Pasta de dente - Colgate</td>
              <td>Pessoal</td>
              <td>5</td>
              <td>
                <button type="button" class="botao botao-perigo botao-pequeno">
                  Excluir
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="paginacao">
        <button type="button" id="botao-anterior" class="botao botao-pequeno">
          Anterior
        </button>
        <span>Página <strong id="numero-pagina">1</strong></span>
        <button type="button" id="botao-proxima" class="botao botao-pequeno">
          Próxima
        </button>
      </div>
    </section>
  </main>

  <footer class="rodape">Almoxarifado © 2026 | Feito por Steffany</footer>
</body>
</html>
