<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro | Almoxarifado</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body class="pagina-login">
  <main class="login-main">
    <section class="cartao caixa-login">
      <div class="icone" aria-hidden="true">🫧</div>
      <h1>Criar conta</h1>
      <p class="subtitulo">Preencha seus dados para se cadastrar</p>

      <form id="form-cadastro">
        <label for="nome">Nome</label>
        <input
          type="text"
          id="nome"
          name="nome"
          placeholder="Seu nome completo"
          required
        >

        <label for="email">E-mail</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="seuemail@exemplo.com"
          required
        >

        <label for="senha">Senha</label>
        <input
          type="password"
          id="senha"
          name="senha"
          placeholder="Crie uma senha"
          required
        >

        <label for="tipo">Tipo de perfil</label>
        <select id="tipo" name="tipo" required>
          <option value="">Selecione um perfil</option>
          <option value="usuario">Usuário</option>
          <option value="admin">Administrador</option>
        </select>

        <button type="submit" class="botao">Cadastrar</button>
      </form>

      <p class="mensagem">
        Já tem uma conta? <a href="index.html">Entrar</a>
      </p>
    </section>
  </main>
</body>
</html>
